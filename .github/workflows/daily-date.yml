name: Daily Date Update

on:
  schedule:
    - cron: "22 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update readme dates
        run: |
          python3 - << 'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          full = f"{now.year}年{now.month}月{now.day}日"  # 2026年9月15日

          p = Path("readme.md")
          text = p.read_text(encoding="utf-8")

          # 标题：# 机场推荐(2026年9月15日更新)
          text = re.sub(
              r"#\s*机场推荐\([^)]*\)",
              f"# 机场推荐({full}更新)",
              text,
              count=1,
          )

          # 正文：最近可用状态更新于：2026年9月15日
          text = re.sub(
              r"最近可用状态更新于：[^\n]*",
              f"最近可用状态更新于：{full}",
              text,
              count=1,
          )

          p.write_text(text, encoding="utf-8")
          print("written:", full)
          PY

      - name: Commit and push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add readme.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: 更新 readme 日期"
            git push
          fi
